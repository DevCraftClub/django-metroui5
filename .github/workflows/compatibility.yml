name: Django compatibility

on:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Тесты с Django 4.1+; для новых проектов рекомендуем >=5.2.17.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.1.13", "4.2.30", "5.0.14", "5.1.15", "5.2.17", "6.0.10", "6.1.3"]
        exclude:
          # Django 4.1: Python ≤3.10
          - python-version: "3.11"
            django-version: "4.1.13"
          - python-version: "3.12"
            django-version: "4.1.13"
          - python-version: "3.13"
            django-version: "4.1.13"
          # Django 4.2: Python ≤3.12
          - python-version: "3.13"
            django-version: "4.2.30"
          # Django 5.0: Python ≤3.12
          - python-version: "3.13"
            django-version: "5.0.14"
          # Django 6.0 и 6.1: Python ≥3.12
          - python-version: "3.10"
            django-version: "6.0.10"
          - python-version: "3.11"
            django-version: "6.0.10"
          - python-version: "3.10"
            django-version: "6.1.3"
          - python-version: "3.11"
            django-version: "6.1.3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}"
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django-version }}"
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        run: |
          pytest --cov=metroui5 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
