name: Django compatibility

on:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }}
    # Python 3.9 есть только до Ubuntu 24.04. На ubuntu-latest (26.04) сборки нет.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Пересечение pyproject (Python >=3.9, Django>=4.2,<6.1) и классификаторов Django.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        exclude:
          # Django 4.2: Python 3.8–3.12
          - python-version: "3.13"
            django-version: "4.2"
          # Django 5.0: Python 3.10–3.12
          - python-version: "3.9"
            django-version: "5.0"
          - python-version: "3.13"
            django-version: "5.0"
          # Django 5.1 и 5.2: Python 3.10–3.13
          - python-version: "3.9"
            django-version: "5.1"
          - python-version: "3.9"
            django-version: "5.2"
          # Django 6.0: Python 3.12+
          - python-version: "3.9"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install -e ".[dev]"
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        run: |
          pytest --cov=metroui5 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
