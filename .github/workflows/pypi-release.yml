name: Compatibility Test and PyPI Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual triggering
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        default: ""

env:
  PYTHON_VERSION: "3.13"
  PYTHON_VERSION_MIN: "3.9"

jobs:
  test:
    name: Compatibility Test Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]
        django-version: [ "4.1", "4.2", "5.0", "5.1", "5.2.5" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django==${{ matrix.django-version }}"
          pip install -e .[dev]
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        run: |
          pytest --cov=metroui5 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [ test, build ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Verify package
        run: |
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_KEY }}
          TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Django MetroUI5 ${{ github.ref_name }}

            ### 🚀 New Features
            - Add your new features here

            ### 🐛 Bug Fixes
            - Add your bug fixes here

            ### 📚 Documentation
            - Add documentation updates here

            ### 🔧 Dependencies
            - Updated dependencies

            ### 📦 Installation
            ```bash
            pip install django-metroui5==${{ github.ref_name }}
            ```

            ### 🔗 Links
            - [Documentation](https://django-metroui5.readthedocs.io/)
            - [GitHub Repository](https://github.com/DevCraftClub/django-metroui5)
            - [PyPI Package](https://pypi.org/project/django-metroui5/)

  test-install:
    name: Test PyPI Installation
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test package installation from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install django-metroui5==${{ github.ref_name || 'latest' }}
          python -c "import metroui5; print('Package imported successfully')"

      - name: Test demo application
        run: |
          cd example
          python manage.py check
          python manage.py test --verbosity=2
