name: PyPI Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual triggering
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        default: ""
      skip_publish:
        description: "Skip publishing to PyPI"
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.13"
  PYTHON_VERSION_MIN: "3.9"

jobs:
  compatibility:
    name: Django compatibility
    uses: ./.github/workflows/compatibility.yml

  build:
    name: Build Package
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [build, compatibility]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.compatibility.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.event.inputs.skip_publish != 'true'
    environment: pypi
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      version_string: ${{ steps.set_version.outputs.version_string }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Verify package
        run: |
          twine check dist/*

      - name: Set version
        id: set_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "VERSION_STRING==\${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "version_string==\${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "VERSION_STRING==\${{ github.ref_name }}" >> $GITHUB_ENV
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "version_string==\${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=" >> $GITHUB_ENV
            echo "VERSION_STRING=" >> $GITHUB_ENV
            echo "version=" >> $GITHUB_OUTPUT
            echo "version_string=" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_KEY }}
          TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.result == 'success' && needs.release.outputs.version || '' }}
          VERSION_STRING: ${{ needs.release.result == 'success' && needs.release.outputs.version_string || '' }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Django MetroUI5 ${{ github.ref_name }}

            ### 🚀 New Features
            - Add your new features here

            ### 🐛 Bug Fixes
            - Add your bug fixes here

            ### 📚 Documentation
            - Add documentation updates here

            ### 🔧 Dependencies
            - Updated dependencies

            ### 📦 Installation
            ```bash
            if [ -n "${{ env.VERSION_STRING }}" ]; then
              echo "Installing django-metroui5${{ env.VERSION_STRING }}"
              pip install django-metroui5==${{ env.VERSION_STRING }}
            else
              echo "Installing latest django-metroui5"
              pip install -U django-metroui5
            fi
            ```

            ### 🔗 Links
            - [Documentation](https://github.com/DevCraftClub/django-metroui5/tree/main/docs)
            - [GitHub Repository](https://github.com/DevCraftClub/django-metroui5)
            - [PyPI Package](https://pypi.org/project/django-metroui5/)

  test-install:
    name: Test PyPI Installation
    runs-on: ubuntu-latest
    needs: [build, release]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success'
    env:
      VERSION: ${{ needs.release.result == 'success' && needs.release.outputs.version || '' }}
      VERSION_STRING: ${{ needs.release.result == 'success' && needs.release.outputs.version_string || '' }}

    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test package installation from PyPI
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -n "${{ env.VERSION_STRING }}" ]; then
            echo "Installing django-metroui5${{ env.VERSION_STRING }}"
            pip install django-metroui5==${{ env.VERSION_STRING }}
          else
            echo "Installing latest django-metroui5"
            pip install -U django-metroui5
          fi
          python -c "import metroui5; print('Package imported successfully')"

      - name: Test demo application
        run: |
          cd example
          python manage.py check
          python manage.py test --verbosity=2
