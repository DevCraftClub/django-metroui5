name: Compatibility Test and Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # Allow manual triggering
    inputs:
      test_type:
        description: "Type of compatibility testing to run"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "compatibility-test-only"
          - "build-only"
          - "type-check-only"

env:
  PYTHON_VERSION: "3.13"
  PYTHON_VERSION_MIN: "3.9"

jobs:
  test:
    name: Compatibility Test
    # Python 3.9 есть только до Ubuntu 24.04. На ubuntu-latest (26.04) сборки нет.
    runs-on: ubuntu-24.04
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'compatibility-test-only' || github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2.16", "5.0.8", "5.1.4", "5.2.5"]
        exclude:
          # Django 5.0+ doesn't support Python 3.9
          - python-version: "3.9"
            django-version: "5.0.8"
          - python-version: "3.9"
            django-version: "5.1.4"
          - python-version: "3.9"
            django-version: "5.2.5"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "django==${{ matrix.django-version }}"
          pip install -e .[dev]
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        run: |
          pytest --cov=metroui5 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'build-only' || github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build package
        run: |
          python -m build

      - name: Verify package
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7

  lint:
    name: Type Checking
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'type-check-only' || github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install type checking tools
        run: |
          python -m pip install --upgrade pip
          pip install "mypy>=1,<2"

      - name: Run MyPy (type checking)
        run: |
          mypy metroui5/ --ignore-missing-imports
