name: Bug Report
description: Report a bug or issue with Django MetroUI5
title: "[Bug]: "
labels:
    - bug
    - Ошибка
assignees:
    - Gokujo
body:
    -   type: markdown
        attributes:
            value: |
                Thanks for taking the time to report this issue!
                
                Спасибо, что нашли время, чтобы сообщить об этой проблеме!
    -   type: checkboxes
        id: read-rules
        attributes:
            label: User Agreement
            description: Before requesting to add or "fix" anything urgently - [please read the agreement](https://devcraft.club/pages/licence-agreement/).
            options:
                -   label: I have read and agree to the terms and conditions
                    required: true
    -   type: textarea
        id: what-happened
        attributes:
            label: What happened?
            description: Please describe the problem in detail and how to reproduce it step by step
            placeholder: Describe the issue here...
            value: "A bug occurred when..."
        validations:
            required: true
    -   type: textarea
        id: what-should-happen
        attributes:
            label: What should happen?
            description: What was the expected behavior when Django MetroUI5 was working correctly?
            placeholder: Describe expected behavior...
            value: "It should have..."
        validations:
            required: false
    -   type: input
        id: package-version
        attributes:
            label: Django MetroUI5 Version
            description: What version of Django MetroUI5 are you using? Check your requirements.txt or pip list
        validations:
            required: true
    -  type: dropdown
       id: django-version
       attributes:
            label: Django Version
            description: What version of Django are you using?
            options:
                - "5.2+ (Default)"
                - "5.1"
                - "5.0"
                - "4.2"
                - "4.1"
                - "4.0"
                - "3.2"
                - "3.1"
                - "3.0"
                - "< 3.0"
       validations:
            required: true
    -   type: dropdown
        id: python-version
        attributes:
            label: Python Version
            description: What version of Python are you using?
            options:
                - "3.13+ (Default)"
                - "3.12"
                - "3.11"
                - "3.10"
                - "3.9"
                - "3.8"
                - "< 3.8"
        validations:
            required: true
    -   type: textarea
        id: environment
        attributes:
            label: Environment Details
            description: Please provide details about your environment (OS, browser if applicable, etc.)
            placeholder: OS: macOS 14.0, Browser: Chrome 120...
            value: "Environment details..."
        validations:
            required: false
    -   type: textarea
        id: "screenshots"
        attributes:
            label: Screenshots
            description: If possible, add screenshots showing the issue
            value: |
                ![Description](link-to-screenshot.png)
        validations:
            required: false
    -   type: textarea
        id: "code-example"
        attributes:
            label: Code Example
            description: If applicable, provide a minimal code example that reproduces the issue
            placeholder: ```python\n# Your code here\n```
            value: "```python\n# Minimal example\n```"
        validations:
            required: false
