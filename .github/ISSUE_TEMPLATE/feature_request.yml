name: Feature Request
description: Request a new feature for Django MetroUI5
title: "[Feature]: "
labels:
    - enhancement
    - Запрос на функционал
assignees:
    - Gokujo
body:
    -   type: markdown
        attributes:
            value: |
                Thanks for taking the time to request a new feature!
                
                Спасибо, что нашли время, чтобы запросить новую функцию!
    -   type: checkboxes
        id: read-rules
        attributes:
            label: User Agreement
            description: Before requesting to add or "fix" anything urgently - [please read the agreement](https://devcraft.club/pages/licence-agreement/).
            options:
                -   label: I have read and agree to the terms and conditions
                    required: true
    -   type: textarea
        id: what-do-you-need
        attributes:
            label: What do you need?
            description: Please describe the feature you would like to see in Django MetroUI5. Be as detailed as possible
            placeholder: I would like to see...
            value: "I need a feature that..."
        validations:
            required: true
    -   type: textarea
        id: use-case
        attributes:
            label: Use Case
            description: How would this feature be used? What problem does it solve?
            placeholder: This feature would help when...
            value: "Use case description..."
        validations:
            required: true
    -  type: dropdown
       id: django-version
       attributes:
            label: Django Version
            description: What version of Django are you targeting?
            options:
                - "5.2+ (Default)"
                - "5.1"
                - "5.0"
                - "4.2"
                - "4.1"
                - "4.0"
                - "3.2"
                - "3.1"
                - "3.0"
                - "< 3.0"
       validations:
            required: true
    -   type: dropdown
        id: python-version
        attributes:
            label: Python Version
            description: What version of Python are you targeting?
            options:
                - "3.13+ (Default)"
                - "3.12"
                - "3.11"
                - "3.10"
                - "3.9"
                - "3.8"
                - "< 3.8"
        validations:
            required: true
    -   type: textarea
        id: "screenshots"
        attributes:
            label: Mockups or Examples
            description: If possible, add mockups, screenshots, or examples of how you envision this feature
            value: |
                ![Description](link-to-mockup.png)
        validations:
            required: false
    -   type: textarea
        id: "alternatives"
        attributes:
            label: Alternatives Considered
            description: Have you considered any alternative solutions or workarounds?
            placeholder: I tried using... but it didn't work because...
            value: "Alternative solutions..."
        validations:
            required: false
