name: Other Requests
description: For questions, discussions, or other requests that don't fit other categories
title: "[Other]: "
labels:
    - Прочее
    - Не знаю куда
    - question
assignees:
    - Gokujo
body:
    -   type: markdown
        attributes:
            value: |
                Thanks for taking the time to submit this request!
                
                Спасибо, что нашли время, чтобы отправить этот запрос!
    -   type: checkboxes
        id: read-rules
        attributes:
            label: User Agreement
            description: Before requesting to add or "fix" anything urgently - [please read the agreement](https://devcraft.club/pages/licence-agreement/).
            options:
                -   label: I have read and agree to the terms and conditions
                    required: true
    -   type: textarea
        id: what-do-you-need
        attributes:
            label: What do you need?
            description: Please describe what you need help with or what you want to discuss. Be as detailed as possible
            placeholder: I need help with... or I want to discuss...
            value: "My request or question..."
        validations:
            required: true
    -   type: dropdown
        id: request-type
        attributes:
            label: Request Type
            description: What type of request is this?
            options:
                - "Question / Вопрос"
                - "Discussion / Обсуждение"
                - "Documentation / Документация"
                - "Installation Help / Помощь с установкой"
                - "Configuration Help / Помощь с настройкой"
                - "Other / Другое"
        validations:
            required: true
    -  type: dropdown
       id: django-version
       attributes:
            label: Django Version
            description: What version of Django are you using?
            options:
                - "5.2+ (Default)"
                - "5.1"
                - "5.0"
                - "4.2"
                - "4.1"
                - "4.0"
                - "3.2"
                - "3.1"
                - "3.0"
                - "< 3.0"
       validations:
            required: true
    -   type: dropdown
        id: python-version
        attributes:
            label: Python Version
            description: What version of Python are you using?
            options:
                - "3.13+ (Default)"
                - "3.12"
                - "3.11"
                - "3.10"
                - "3.9"
                - "3.8"
                - "< 3.8"
        validations:
            required: true
    -   type: textarea
        id: "screenshots"
        attributes:
            label: Screenshots and Files
            description: If applicable, add screenshots and/or files that might help explain your request
            value: |
                ![Description](link-to-file.png)
        validations:
            required: false
    -   type: textarea
        id: "context"
        attributes:
            label: Additional Context
            description: Any additional information that might be helpful (project details, specific use case, etc.)
            placeholder: Additional context...
            value: "Context information..."
        validations:
            required: false
