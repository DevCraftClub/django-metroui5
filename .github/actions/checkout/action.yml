name: "Checkout"
description: "Checkout a repository or a web page"
inputs:
  repository:
    description: "Repository name with owner. For example, actions/checkout"
    default: ${{ github.repository }}
  ref:
    description: "The branch, tag or SHA to checkout. When checking out the repository that triggered a workflow, this defaults to the reference or SHA for that event. Otherwise, uses the default branch."
  token:
    description: 'Personal access token (PAT) used to fetch the repository. The recommended value is `${{ secrets.GITHUB_TOKEN }}`. The `GITHUB_TOKEN` is automatically created as a default secret. For more information, see "[About the GITHUB_TOKEN secret](https://docs.github.com/en/actions/security-guides/automatic-token-authentication#about-the-github_token-secret)."'
    default: ${{ github.token }}
  ssh-key:
    description: 'SSH key used to fetch the repository. The SSH key is configured with the repository. For more information, see "[About SSH key authentication](https://docs.github.com/en/developers/overview/about-ssh-certificate-authentication)."'
  ssh-known-hosts:
    description: 'Known hosts in addition to the user and global server known hosts. Public keys when a `ssh-key` is configured. For more information, see "[SSH known hosts](https://docs.github.com/en/actions/security-guides/automatic-token-authentication#ssh-known-hosts)."'
  ssh-strict:
    description: "Whether to perform strict host key checking. When true, adds the options `StrictHostKeyChecking=yes` and `CheckHostIP=no` to the SSH command. Use the input `ssh-known-hosts` in combination with this option for additional security."
    default: "true"
  persist-credentials:
    description: "Whether to configure the token or SSH key with the local git config. This is required to create tags or push commits to the server."
    default: "true"
  path:
    description: "Relative path under $GITHUB_WORKSPACE to place the repository"
  clean:
    description: "Whether to execute `git clean -ffdx && git reset --hard HEAD` before fetching"
    default: "true"
  fetch-depth:
    description: "Number of commits to fetch. 0 indicates all history for all branches and tags."
    default: "1"
  lfs:
    description: "Whether to download Git-LFS files. Default is false."
    default: "false"
  submodules:
    description: "Whether to checkout submodules: `true` to checkout submodules or `recursive` to recursively checkout submodules."
    default: "false"
  set-safe-directory:
    description: "Add repository path to the global `safe.directory` config to ensure commands can be run. This is only needed for repositories using `actions/checkout@v4` or later, or when the `DONT_SET_SAFE_DIRECTORY` environment variable is not set."
    default: "true"
  github-server-url:
    description: "The base URL for the GitHub instance that you are running from, use `GHES` if you are on GitHub Enterprise, e.g. `https://ghes.internal.com`. The `url` sets the `remote.origin.url` for the repo. If this variable is not set, the default value of `https://github.com` will be used."
    default: "https://github.com"
runs:
  using: "composite"
  steps:
    - name: Checkout
      shell: bash
      run: |
        git clone --depth ${{ inputs.fetch-depth }} --branch ${{ inputs.ref || 'main' }} ${{ inputs.repository }} ${{ inputs.path || '.' }}
        cd ${{ inputs.path || '.' }}
        if [ "${{ inputs.clean }}" = "true" ]; then
          git clean -ffdx
          git reset --hard HEAD
        fi
        if [ "${{ inputs.submodules }}" != "false" ]; then
          git submodule update --init --recursive
        fi
