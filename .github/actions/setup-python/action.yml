name: 'Setup Python'
description: 'Set up a Python environment for use in actions'
inputs:
  python-version:
    description: 'Python version to use. Examples: 3.9, 3.10, 3.11, 3.12, 3.13, pypy3.9, pypy3.10'
    required: true
  python-version-file:
    description: 'File containing the Python version to use. Examples: .python-version, .nvmrc, .node-version, .tool-versions'
  cache:
    description: 'Used to specify a dependency caching strategy. Valid values are: pip, pipenv, poetry, pnpm, yarn, npm'
    default: 'pip'
  cache-dependency-path:
    description: 'Used to specify the path to dependency files. Supports glob patterns. Valid when cache is set to pip, pipenv, poetry, pnpm, yarn, npm'
  architecture:
    description: 'Target architecture for Python to be installed on. Examples: x64, x86, arm64, armv6, armv7, s390x, ppc64le, ppc64, riscv64'
    default: 'x64'
  allow-prereleases:
    description: 'Allow pre-releases to be installed. Defaults to false'
    default: 'false'
  check-latest:
    description: 'Set this option if you want the action to check for the latest available version that satisfies the version spec. Defaults to false'
    default: 'false'
  token:
    description: 'Used to pull python distributions from actions/python-versions. Since there are a limited number of runners per-host, this is only needed when self-hosted runners are used or when a large number of dependencies are being installed. Defaults to ${{ github.token }}'
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      shell: bash
      run: |
        # Install Python using pyenv or system package manager
        if command -v pyenv &> /dev/null; then
          pyenv install ${{ inputs.python-version }} -s
          pyenv global ${{ inputs.python-version }}
        elif command -v apt-get &> /dev/null; then
          # Ubuntu/Debian
          sudo apt-get update
          sudo apt-get install -y python${{ inputs.python-version }}
        elif command -v yum &> /dev/null; then
          # CentOS/RHEL
          sudo yum install -y python${{ inputs.python-version }}
        elif command -v brew &> /dev/null; then
          # macOS
          brew install python@${{ inputs.python-version }}
        else
          echo "No supported package manager found. Using system Python."
        fi
        
        # Set up Python environment
        python --version
        pip --version
        
        # Set up pip cache if requested
        if [ "${{ inputs.cache }}" = "pip" ]; then
          pip config set global.cache-dir ~/.cache/pip
        fi
