name: 'Upload Artifact'
description: 'Upload a file or directory as an artifact'
inputs:
  name:
    description: 'Artifact name'
    required: true
  path:
    description: 'File path, or directory path, to upload'
    required: true
  if-no-files-found:
    description: 'Behavior if no files are found using the provided path. Available Options: warn, error, ignore'
    default: 'warn'
  retention-days:
    description: 'Number of days that this artifact should be retained, after which it will be deleted. 0 means using the default retention. Minimum 1, Maximum 90 will be allowed'
    default: '0'
  compression-level:
    description: 'The level of compression for Zstd to be applied to the artifact archive. The value can range from 1 to 22, with higher values providing better compression. Default value is 6'
    default: '6'
runs:
  using: 'composite'
  steps:
    - name: Upload Artifact
      shell: bash
      run: |
        # Create artifacts directory if it doesn't exist
        mkdir -p ${{ github.workspace }}/_artifacts
        
        # Copy files to artifacts directory
        if [ -d "${{ inputs.path }}" ]; then
          cp -r "${{ inputs.path }}"/* "${{ github.workspace }}/_artifacts/" || true
        elif [ -f "${{ inputs.path }}" ]; then
          cp "${{ inputs.path }}" "${{ github.workspace }}/_artifacts/" || true
        else
          echo "Path ${{ inputs.path }} not found"
          if [ "${{ inputs.if-no-files-found }}" = "error" ]; then
            exit 1
          elif [ "${{ inputs.if-no-files-found }}" = "warn" ]; then
            echo "Warning: No files found at ${{ inputs.path }}"
          fi
        fi
        
        # List artifacts
        echo "Artifacts uploaded:"
        ls -la "${{ github.workspace }}/_artifacts/" || true
        
        # Set output for retention days
        echo "retention-days=${{ inputs.retention-days }}" >> $GITHUB_OUTPUT
