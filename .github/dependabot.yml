# Dependabot configuration for Django MetroUI5
# Конфигурация Dependabot для Django MetroUI5
version: 2
updates:
  # Python dependencies (pip/poetry) - consolidated into one entry
  # Зависимости Python (pip/poetry) - объединено в одну запись
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 20
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "python"
      - "pip"
      - "poetry"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Ignore major version updates for critical packages
      # Игнорировать обновления мажорных версий для критических пакетов
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flake8"
        update-types: ["version-update:semver-major"]
    # Allow updates for development dependencies
    # Разрешить обновления для зависимостей разработки
    allow:
      - dependency-type: "development"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "github-actions"
      include: "scope"
