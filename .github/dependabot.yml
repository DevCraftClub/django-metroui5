# Dependabot configuration for Django MetroUI5
# Конфигурация Dependabot для Django MetroUI5
version: 2
updates:
  # Python dependencies (pip)
  # Зависимости Python (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "pip"
      prefix-development: "pip"
      include: "scope"
    ignore:
      # Ignore major version updates for critical packages
      # Игнорировать обновления мажорных версий для критических пакетов
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flake8"
        update-types: ["version-update:semver-major"]
    # Allow updates for development dependencies
    # Разрешить обновления для зависимостей разработки
    allow:
      - dependency-type: "development"

  # GitHub Actions
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "github-actions"
      include: "scope"

  # npm dependencies (if any frontend assets)
  # Зависимости npm (если есть фронтенд ресурсы)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "npm"
      - "automated"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      # Ignore major version updates for critical packages
      - dependency-name: "metro-ui-core"
        update-types: ["version-update:semver-major"]

  # Poetry dependencies (pyproject.toml)
  # Зависимости Poetry (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 8
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "poetry"
      - "automated"
    commit-message:
      prefix: "poetry"
      include: "scope"
    ignore:
      # Ignore major version updates for critical packages
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flake8"
        update-types: ["version-update:semver-major"]

  # Security updates (always enabled)
  # Обновления безопасности (всегда включены)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    reviewers:
      - "Gokujo"
    assignees:
      - "Gokujo"
    labels:
      - "dependencies"
      - "security"
      - "automated"
      - "high-priority"
    commit-message:
      prefix: "security"
      include: "scope"
    # Only security updates
    ignore:
      - update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
