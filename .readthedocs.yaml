version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install -r docs/requirements.txt
    build:
      html:
        - python -m zensical build
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a site/. "$READTHEDOCS_OUTPUT/html/"

formats: []
